
---
- name: Install Beetle on Ubuntu servers
  hosts: ubuntu
  become: true
  gather_facts: true

  vars:
    beetle_repo: "https://github.com/the404packet/beetle.git"
    beetle_install_dir: "/opt/beetle"

  tasks:
    - name: Verify target is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: "Beetle installation is intended for Ubuntu."

    - name: Check whether Beetle CLI exists
      ansible.builtin.command: command -v beetle
      args:
        executable: /bin/bash
      register: beetle_cli
      changed_when: false
      failed_when: false

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - git
          - gcc
          - bash
        state: present
        update_cache: true
      when: beetle_cli.rc != 0

    - name: Clone Beetle repository
      ansible.builtin.git:
        repo: "{{ beetle_repo }}"
        dest: "{{ beetle_install_dir }}"
        version: main
        update: false
      when: beetle_cli.rc != 0

    - name: Run Beetle installer
      ansible.builtin.command:
        cmd: ./install.sh
        chdir: "{{ beetle_install_dir }}/ubuntu"
      when: beetle_cli.rc != 0

    - name: Enable and start Beetle daemon
      ansible.builtin.systemd:
        name: beetled
        enabled: true
        state: started

    - name: Verify Beetle CLI
      ansible.builtin.command: beetle version
      register: beetle_version
      changed_when: false

    - name: Display installed version
      ansible.builtin.debug:
        var: beetle_version.stdout
