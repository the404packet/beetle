
---
- name: Audit Ubuntu servers using Beetle
  hosts: ubuntu
  become: true
  gather_facts: false

  tasks:
    - name: Verify Beetle is installed
      ansible.builtin.command: beetle version
      changed_when: false

    - name: Run Beetle security audit
      ansible.builtin.command: beetle audit
      register: audit_result
      changed_when: false

    - name: Display audit results
      ansible.builtin.debug:
        msg: |
          Host: {{ inventory_hostname }}
          Exit code: {{ audit_result.rc }}

          {{ audit_result.stdout }}

          {{ audit_result.stderr }}
